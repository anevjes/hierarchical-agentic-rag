<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Page-aware Foundry IQ and Microsoft Agent Framework architecture</title>
  <desc id="diagram-description">Exported from architecture.excalidraw. Blob PDFs flow through Content Understanding to cached page Markdown and a hybrid Search index. A Foundry IQ knowledge base supports an investigator that opens pages before a separate writer answers.</desc>
  <rect x="0" y="0" width="1440" height="990" fill="#ffffff" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="start" opacity="1.0">
    <tspan x="40" y="48.0">Page-aware Foundry IQ + Microsoft Agent Framework</tspan>
  </text>
  <rect stroke="#0078D4" stroke-width="2" fill="none" opacity="1.0" x="20" y="110" width="1400" height="300" rx="12" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" opacity="1.0">
    <tspan x="40" y="143.0">INGESTION - explicit CLI, Azure SDKs, DefaultAzureCredential</tspan>
  </text>
  <rect stroke="#0078D4" stroke-width="2" fill="#CFE4FA" opacity="1.0" x="50" y="210" width="230" height="150" rx="0" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" opacity="1.0">
    <tspan x="165.0" y="258.0">Private Blob</tspan>
    <tspan x="165.0" y="291.3333333333333">Original PDFs</tspan>
    <tspan x="165.0" y="324.6666666666667">ETag checked</tspan>
  </text>
  <rect stroke="#F7630C" stroke-width="2" fill="#FFF4CE" opacity="1.0" x="350" y="210" width="240" height="150" rx="0" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" opacity="1.0">
    <tspan x="470.0" y="247.0">Content Understanding</tspan>
    <tspan x="470.0" y="287.0">OCR + visual analysis</tspan>
    <tspan x="470.0" y="327.0">Physical page spans</tspan>
  </text>
  <rect stroke="#0078D4" stroke-width="2" fill="#CFE4FA" opacity="1.0" x="660" y="210" width="300" height="150" rx="0" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" opacity="1.0">
    <tspan x="810.0" y="247.0">Private derived Blob</tspan>
    <tspan x="810.0" y="287.0">Manifest + document.md</tspan>
    <tspan x="810.0" y="327.0">pages/0001.md, 0002.md ...</tspan>
  </text>
  <rect stroke="#5C2D91" stroke-width="2" fill="#E8DAEF" opacity="1.0" x="1050" y="210" width="330" height="150" rx="0" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" opacity="1.0">
    <tspan x="1215.0" y="247.0">Azure AI Search index</tspan>
    <tspan x="1215.0" y="287.0">Chunk text + embeddings</tspan>
    <tspan x="1215.0" y="327.0">Hybrid + semantic ranking</tspan>
  </text>
