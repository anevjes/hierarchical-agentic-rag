  <rect stroke="#107C10" stroke-width="2" fill="none" opacity="1.0" x="20" y="450" width="1400" height="520" rx="12" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" opacity="1.0">
    <tspan x="40" y="483.0">QUERY - isolated per-question state; bounded MAF tool-invocation loop</tspan>
  </text>
  <rect stroke="#5C2D91" stroke-width="2" fill="#E8DAEF" opacity="1.0" x="1050" y="550" width="330" height="180" rx="0" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" opacity="1.0">
    <tspan x="1215.0" y="587.0">Foundry IQ knowledge base</tspan>
    <tspan x="1215.0" y="624.5">Search-index knowledge source</tspan>
    <tspan x="1215.0" y="662.0">Extractive semantic intent</tspan>
    <tspan x="1215.0" y="699.5">No KB answer synthesis</tspan>
  </text>
  <rect stroke="#107C10" stroke-width="2" fill="#DFF6DD" opacity="1.0" x="470" y="550" width="440" height="180" rx="0" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" opacity="1.0">
    <tspan x="690.0" y="583.0">MAF Document Investigator</tspan>
    <tspan x="690.0" y="623.0">search_knowledge_base</tspan>
    <tspan x="690.0" y="663.0">open_pages / search_document</tspan>
    <tspan x="690.0" y="703.0">Assess coverage; do not answer</tspan>
  </text>
  <rect stroke="#0078D4" stroke-width="2" fill="#CFE4FA" opacity="1.0" x="50" y="590" width="280" height="100" rx="0" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle" opacity="1.0">
    <tspan x="190.0" y="639.0">Original user question</tspan>
  </text>
  <rect stroke="#107C10" stroke-width="2" fill="#DFF6DD" opacity="1.0" x="470" y="810" width="440" height="120" rx="0" />
  <text fill="#000000" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" opacity="1.0">
    <tspan x="690.0" y="848.0">Sufficiency gate -&gt; tool-free writer</tspan>
    <tspan x="690.0" y="893.0">Validated quotes + private #page links</tspan>
  </text>
